name: Android Release APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17" # Switched to 17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --force

      - name: Build web app (Static Export)
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Upgrade Gradle Wrapper (Fix JAR parsing bug)
        run: |
          # Dynamically upgrades Gradle from 8.2.1 to 8.7 before building.
          # This avoids the ASM bytecode crash without touching your local files.
          sed -i 's/gradle-.*-all\.zip/gradle-8.7-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties

      - name: Build Unsigned Release APK
        run: |
          cd android
          chmod +x gradlew
          bash ./gradlew assembleRelease

      - name: Upload Unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: obills-unsigned-release-apk
          path: android/app/build/outputs/apk/release/*.apk