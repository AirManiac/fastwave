name: Android Debug APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          # Gradle cache disabled temporarily to flush out the corrupted 1.79 jar

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --force

      - name: Build web app (Static Export)
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch Gradle (Fix Bouncy Castle Bug)
        run: |
          echo "
          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.bouncycastle') {
                          details.useVersion '1.78.1'
                      }
                  }
              }
          }
          " >> android/build.gradle

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          # assembleDebug creates an APK that is auto-signed for testing
          bash ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pancity-debug-apk
          # Path points back to the debug folder
          path: android/app/build/outputs/apk/debug/*.apk